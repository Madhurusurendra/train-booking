name: CI pipeline to build Java code

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Setup JDK
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Validate Maven
      - name: Validate with Maven
        run: mvn validate

      # 4. Compile Java code
      - name: Compile with Maven
        run: mvn compile

      # 5. Test Java code
      - name: Test with Maven
        run: mvn test

      # 6. Build WAR file
      - name: Package with Maven
        run: mvn clean package -DskipTests

      - name: Deploy WAR to Tomcat
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          set -e

          echo "Deploying application to Tomcat..."

          if [ -z "$TOMCAT_HOST" ]; then
            echo "ERROR: TOMCAT_HOST secret is missing"
            exit 1
          fi

          WAR_FILE=$(find target -maxdepth 1 -name "*.war" -print -quit)

          if [ -z "$WAR_FILE" ]; then
            echo "ERROR: WAR file not found"
            exit 1
          fi

          curl --fail --show-error \
            -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            -T "$WAR_FILE" \
            "$TOMCAT_HOST/manager/text/deploy?path=/TrainBook&update=true"
